# Local development only. Server/production deployment runs the built
# artifacts with its own managed database and env configuration.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: society_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d society_management"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
